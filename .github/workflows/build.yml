name: Build ZeroOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y live-build debootstrap xorriso squashfs-tools debian-archive-keyring ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Debian Live
        run: |
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free-firmware" \
            --binary-images iso-hybrid \
            --debian-installer none \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --bootappend-live "boot=live components username=user hostname=zeroos"

      - name: Build ISO
        run: lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ZeroOS-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publicar a ISO como versão
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar a ISO gerada
        uses: actions/download-artifact@v4
        with:
          name: ZeroOS-ISO
          path: iso

      - name: Preparar arquivos
        run: |
          ISO=$(find iso -maxdepth 1 -name "*.iso" | head -1)
          find iso -maxdepth 1 -name "*.iso" ! -path "$ISO" -delete
          mv "$ISO" iso/ZeroOS-0.1.iso
          cd iso
          sha256sum ZeroOS-0.1.iso > SHA256SUMS

      - name: Publicar a versão no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.1 --cleanup-tag --yes || true
          gh release create v0.1 iso/ZeroOS-0.1.iso iso/SHA256SUMS \
            --title "Zero OS 0.1" \
            --notes "Primeira versão beta do Zero OS. Grave a ISO num pendrive e experimente sem instalar." \
            --latest
