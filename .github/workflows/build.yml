name: Build ZeroOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y live-build debootstrap xorriso squashfs-tools debian-archive-keyring ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Debian Live
        run: |
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free-firmware" \
            --binary-images iso-hybrid \
            --debian-installer none \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --bootappend-live "boot=live components username=user hostname=zeroos"

      - name: Build ISO
        run: lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ZeroOS-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
